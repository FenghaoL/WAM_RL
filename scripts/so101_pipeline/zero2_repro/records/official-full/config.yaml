output_dir: runs/zero2_repro/official-full/model
batch_size: 1
num_workers: 0
lr_scheduler_type: cosine
learning_rate: 5.0e-05
num_epochs: 5
max_steps: 1
log_every: 1
save_every: 1000000
eval_every: 0
eval_num_inference_steps: 10
save_at_end: true
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
freeze_video_dit: false
resume: null
init_checkpoint: null
resume_global_batch_size: null
wandb:
  enabled: false
  workspace: null
  project: ahawam
  name: robotwin_ahawam
  group: null
  mode: offline
data:
  train:
    _target_: ahawam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs:
    - data/robotwin2.0-fastwam/robotwin2.0
    shape_meta:
      images:
      - key: cam_high
        raw_shape:
        - 3
        - 480
        - 640
        shape:
        - 3
        - 240
        - 320
      - key: cam_left_wrist
        raw_shape:
        - 3
        - 480
        - 640
        shape:
        - 3
        - 240
        - 320
      - key: cam_right_wrist
        raw_shape:
        - 3
        - 480
        - 640
        shape:
        - 3
        - 240
        - 320
      action:
      - key: default
        raw_shape: 14
        shape: 14
      state:
      - key: default
        raw_shape: 14
        shape: 14
    num_frames: 65
    global_sample_stride: 1
    action_video_freq_ratio: 8
    video_size:
    - 384
    - 320
    camera_key: null
    val_set_proportion: 0.01
    is_training_set: true
    pretrained_norm_stats: checkpoints/AHA-WAM-RoboTwin2.0/dataset_stats.json
    skip_padding_as_possible: false
    concat_multi_camera: robotwin
    processor:
      _target_: ahawam.datasets.lerobot.processors.ahawam_processor.AHAWAMProcessor
      shape_meta:
        images:
        - key: cam_high
          raw_shape:
          - 3
          - 480
          - 640
          shape:
          - 3
          - 240
          - 320
        - key: cam_left_wrist
          raw_shape:
          - 3
          - 480
          - 640
          shape:
          - 3
          - 240
          - 320
        - key: cam_right_wrist
          raw_shape:
          - 3
          - 480
          - 640
          shape:
          - 3
          - 240
          - 320
        action:
        - key: default
          raw_shape: 14
          shape: 14
        state:
        - key: default
          raw_shape: 14
          shape: 14
      num_obs_steps: 65
      num_output_cameras: 3
      action_output_dim: 14
      proprio_output_dim: 14
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: z-score
      norm_exception_mode: null
      action_state_merger:
        _target_: ahawam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
      - _target_: ahawam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 240
        - 320
      val_transforms:
      - _target_: ahawam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 240
        - 320
    text_embedding_cache_dir: data/robotwin_text_embeds_cache
    video_latent_cache_dir: null
    context_len: 128
  val: null
model:
  _target_: ahawam.runtime.create_ahawam
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  tokenizer_max_len: 128
  load_text_encoder: false
  proprio_dim: 14
  redirect_common_files: true
  mot_checkpoint_mixed_attn: true
  action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  skip_dit_load_from_pretrain: false
  action_horizon: 64
  action_chunk_size: 16
  max_action_offset: 0
  action_train_timestep_mode: per_chunk
  action_obs_downsample_factor: 1
  chunk_kv_editor_num_queries: 32
  num_history_frames: 6
  action_video_read_mode: current_only
  video_rope_frame_stride: 8
  video_dit_config:
    has_image_input: false
    patch_size:
    - 1
    - 2
    - 2
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: true
    video_attention_mask_mode: per_frame_causal
    action_conditioned: false
    action_dim: 14
    action_group_causal_mask_mode: group_diagonal
  action_dit_config:
    action_dim: 14
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    autoregressive_teacher_forcing: true
    action_chunk_size: 16
    action_teacher_forcing_mask_mode: stage1_chunkwise
    use_gradient_checkpointing: true
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  loss:
    lambda_action: 1.0
    lambda_action_prior: 1.0
history_aware_batching: true
