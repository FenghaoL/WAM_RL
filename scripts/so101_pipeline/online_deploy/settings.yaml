# Final SO101 G05 square-task deployment configuration.
# 000860 001720 002580 003440
checkpoint_path: runs/so101_ahawam_plug_hil/mixed_scratch_zero2/formal-mixed-scratch-demo-plus-dagger-bs4-4ep-3gpu-20260831-004343/model/checkpoints/weights/step_011036.pt
dataset_stats_path: runs/so101_ahawam_plug_all/assets/dataset_stats.json
text_embedding_cache_dir: data/so101_ahawam_square_v1_text_embeds_cache
load_text_encoder: false
project_root: .

hydra_config_name: deploy
task: robotwin_ahawam_offset

# Reconstruct the exact 6-D, 15 Hz model shape used by the completed run.
hydra_patch:
  model:
    skip_dit_load_from_pretrain: true
    action_dit_pretrained_path: null
    checkpoint_shape_adapt: true
    mot_checkpoint_mixed_attn: false
    action_horizon: 40
    action_chunk_size: 8
    max_action_offset: 7
    action_obs_downsample_factor: 1
    chunk_kv_editor_num_queries: 32
    num_history_frames: 6 #6
    action_video_read_mode: current_only
    video_rope_frame_stride: 4
  data:
    train:
      shape_meta:
        images:
          - key: fixed
            raw_shape: [3, 480, 480]
            shape: [3, 240, 320]
          - key: wrist
            raw_shape: [3, 480, 640]
            shape: [3, 240, 320]
        action:
          - key: default
            raw_shape: 6
            shape: 6
        state:
          - key: default
            raw_shape: 6
            shape: 6
      num_frames: 49
      action_video_freq_ratio: 4
      video_size: [384, 320]
      processor:
        shape_meta: ${data.train.shape_meta}
        num_obs_steps: ${data.train.num_frames}
        num_output_cameras: 2
        action_output_dim: 6
        proprio_output_dim: 6
        action_state_transforms: null
        use_stepwise_action_norm: false
        norm_default_mode: z-score
        norm_exception_mode: null

device: cuda
mixed_precision: bf16
action_horizon: 40
num_inference_steps: 10
sigma_shift: null
seed: 42
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
warmup_rounds: 0
video_height: 384
video_width: 320

# The explicit future-video diagnostic mirrors the 13 frames seen by the
# video branch during training: 15 Hz / ratio 4 = 3.75 FPS over 3.2 seconds.
input_control_hz: 15.0
action_video_freq_ratio: 4
preview_num_frames: 13
# Fast-WAM's official joint sampler defaults to 20 flow steps. Keep this
# separate from the 10-step action sampler used by the online control path.
preview_num_inference_steps: 20
preview_fps: 3.75
preview_output_dir: runs/so101_g05_square_v1/online_previews
