# Four-A100 restart of SO101 power-adapter-v2 AHA-WAM-Flash ODE distillation.
#
# This is a fresh student initialized from the step-005328 task-SFT teacher. It
# deliberately keeps the same effective batch as the original two-GPU run:
#   4 GPUs x micro-batch 1 x gradient accumulation 4 = 16.
source_trainer_state: runs/so101_ahawam_padapter_v2/full_zero2_offload_ahawam_base/formal-padapterv2-sft-ahawambase-bs4-acc1-4ep-3gpu-20260901-001743/model/checkpoints/step_005328_trainer_state.json
source_model_config: runs/so101_ahawam_padapter_v2/full_zero2_offload_ahawam_base/formal-padapterv2-sft-ahawambase-bs4-acc1-4ep-3gpu-20260901-001743/model/config.yaml
teacher_checkpoint: runs/so101_ahawam_padapter_v2/full_zero2_offload_ahawam_base/formal-padapterv2-sft-ahawambase-bs4-acc1-4ep-3gpu-20260901-001743/model/checkpoints/weights/step_005328.pt

distillation:
  teacher_num_inference_steps: 16
  teacher_capture_step_indices: [0, 1, 2, 4, 8, 12, 16]
  teacher_sigma_shift: null
  student_capture_timestep_mode: per_chunk
  student_default_action_inference_steps: 2

training:
  batch_size: 1
  num_workers: 2
  gradient_accumulation_steps: 4
  num_epochs: 5
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  mixed_precision: bf16
  log_every: 1
  eval_times_per_epoch: 1
  save_every_epochs: 1
  seed: 42

wandb:
  enabled: true
  project: ahawam-so101-padapter-v2-flash
  group: ode2-distill-from-step005328-4xa100
  mode: offline
